; ================= DAPNETGateway 配置文件（扁平 key=value，不再分 [General]/[Log]/[DAPNET] 段）
; ★ 旧三段式 ini 不能直接沿用：新 parser 忽略 section 名，且 AuthKey 已改名 Password。
;   行首 '#' 或 ';' 才是注释；行内 '#" 不再截断 —— 密码里可以安全含 # !
; 布尔：1/yes/true/on 为真。RIC 十进制 1..2097151。

Callsign=BI4TEST
Password=replace-with-your-dapnet-auth-key     ; ★ 必填；TOPSECRET / CHANGE_ME 会被拒绝启动
MasterHost=dapnet.afu.rwth-aachen.de
MasterPort=43434                                ; ★ DAPNET 标准是 43434，不是旧默认的 8070
BackupHost=dapnet-affi.db0sda.ampr.org          ; 主挂了自动轮转，原版此配置是死配置
BackupPort=43434
LocalHost=127.0.0.1
LocalPort=4800                                  ; 必须等于 MMDVMHost.ini 里 [DAPNET] LocalPort

WhiteList=                                      ; 空 = 全部放行（RIC 逗号分隔）
BlackList=
BlacklistRegexfile=/opt/DAPNETGateway/blregexes.txt   ; 每行一条 ECMAScript 正则，子串即命中
WhitelistRegexfile=/opt/DAPNETGateway/wlregexes.txt

MaxQueue=500                                    ; ★ 新增：超出丢最旧并告警，防 MMDVM 长时间占用时 OOM

LogFilePath=/tmp
LogFileRoot=DAPNETGateway
LogFileLevel=2
LogDisplayLevel=3
LogFileRotate=1
Debug=0
Daemon=0
